<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">White World — Disparais pour les retrouver</title>
<desc id="desc">Jeu mobile d’infiltration. Soixante étages dans une tour blanche, des gardes colorés et un peuple à libérer.</desc>
<rect width="1200" height="630" fill="#f5f7f3"/>
<path d="M0 80h1200M0 550h1200" stroke="#d9e1dc"/>
<g fill="#192928" font-family="system-ui,-apple-system,sans-serif">
<text x="64" y="51" font-size="22" font-weight="700" letter-spacing="-1">WHITE WORLD</text>
<text x="64" y="198" font-size="66" font-weight="650" letter-spacing="-3">Disparais.</text>
<text x="64" y="277" font-size="66" font-weight="650" letter-spacing="-3">Pour les</text>
<text x="64" y="356" font-size="66" font-weight="650" letter-spacing="-3" fill="#096c65">retrouver.</text>
<text x="67" y="422" font-size="16" letter-spacing="2">60 ÉTAGES · INFILTRATION MOBILE</text>
<text x="64" y="591" font-size="15" fill="#536460">Un monde blanc. Un peuple captif. Un dernier espoir.</text>
</g>
